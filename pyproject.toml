[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v6_logistic_regression_py"
version = "1.0.0"
description = "Vantage6 algorithm for logistic regression"
readme = "README.md"
requires-python = ">=3.7"
license = { file = "LICENSE" }
keywords = ["Vantage6", "Federated Algorithms", "Supervised Learning"]
dependencies = [
    "vantage6-client",
    "pandas>=1.2.1",
    "scipy>=1.7.3",
    "scikit-learn>=1.0.2",
    "flwr>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/MaastrichtU-CDS/v6-logistic-regression-py"

[tool.setuptools.packages.find]
include = ["v6_logistic_regression_py*"]
